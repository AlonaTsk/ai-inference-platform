# Tooling configuration only; the services are not installed as packages.
# Run tools from the repository root.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", ".venv-gpu"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004"]  # magic numbers are fine in benchmarks and tests

[tool.ruff.lint.isort]
known-first-party = ["app", "textclf"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["inference", "gpu"]
ignore_missing_imports = true  # scikit-learn and joblib ship no type stubs
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# `app` lives in inference/, `textclf` in gpu/.
pythonpath = ["inference", "gpu"]
addopts = "-ra"
