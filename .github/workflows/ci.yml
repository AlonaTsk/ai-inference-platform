name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: false  # stdlib only, no go.sum to key a cache on
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: inference/requirements-dev.txt
      - run: pip install -r inference/requirements-dev.txt
      - name: gofmt
        run: test -z "$(gofmt -l api)"
      - name: go vet + staticcheck
        working-directory: api
        run: go vet ./... && go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy inference/app inference/tests benchmarks

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: false  # stdlib only, no go.sum to key a cache on
      - name: test
        working-directory: api
        run: go test -race -count=1 ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: inference/requirements-dev.txt
      - run: pip install -r inference/requirements-dev.txt
      - run: python -m pytest inference/tests -q
      - name: train and print held-out metrics
        working-directory: inference
        run: python -m app.train --out model && cat model/metrics.json

  gpu-module:
    # Runs the PyTorch code on CPU; the CUDA-only test is skipped (no GPU runners).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install numpy pytest mypy==1.13.0
      - name: mypy
        run: mypy gpu
      - name: tests
        run: python -m pytest gpu -q
      - name: benchmark smoke run (CPU)
        run: PYTHONPATH=inference python gpu/benchmark.py --batches 1,64 --iters 20 --epochs 2
      - name: Kubernetes GPU manifests build
        run: kubectl kustomize deployments/k8s/gpu && kubectl kustomize deployments/k8s/gpu-mock

  kind-e2e:
    needs: [go, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build images
        run: docker compose build
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ai-inference
          config: deployments/k8s/kind-config.yaml
      - name: deploy
        run: |
          kind load docker-image ai-inference-platform/api:dev ai-inference-platform/inference:dev --name ai-inference
          kubectl apply -k deployments/k8s
          kubectl -n ai-inference rollout status deploy/inference --timeout=180s
          kubectl -n ai-inference rollout status deploy/api --timeout=180s
          kubectl -n ai-inference get pods,svc -o wide
      - name: end-to-end test
        run: |
          kubectl -n ai-inference port-forward svc/api 8080:80 &
          sleep 3
          tests/e2e.sh http://localhost:8080
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl -n ai-inference get pods -o wide
          kubectl -n ai-inference describe pods
          kubectl -n ai-inference logs -l app=api --tail=50
          kubectl -n ai-inference logs -l app=inference --tail=50
